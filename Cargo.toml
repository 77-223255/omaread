[package]
name = "omaread"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "A small terminal EPUB reader: a library, reading positions and pictures"
repository = "https://github.com/77-223255/omaread"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2.189"
ratatui = { version = "0.30.2", features = ["underline-color"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.4"
unicode-width = "0.2.2"
# EPUB permits stored and deflated entries only, so the other compressors are
# left out. They pull in C libraries, which would otherwise force a C toolchain
# on anyone building the reader and stand in the way of a static binary.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# The reader ships as one binary, and a smaller one is a smaller download and
# less to page in. Symbol names are no use on a machine that is not going to
# debug it, and LTO folds the duplicated generic instantiations the image
# decoders produce.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
